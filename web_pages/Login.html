<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <title>Login | LEELA</title>

</head>

<body class="bg-[#F8F4EB] min-h-screen flex items-center justify-center px-4">

    <!-- Login Card -->
    <div class="bg-white shadow-2xl rounded-lg w-full max-w-md p-8 md:p-10">

        <!-- Logo -->
        <div class="text-center">

            <h1 class="text-4xl md:text-5xl tracking-[0.3em]"
                style="font-family:'Cinzel', serif;">
                LEELA
            </h1>

            <p class="text-xs tracking-[0.35em] text-gray-500 uppercase mt-2">
                Palaces • Hotels • Resorts
            </p>

            <h2 class="text-3xl font-serif mt-8 text-gray-800">
                Welcome Back
            </h2>

            <p class="text-gray-500 mt-2">
                Sign in to continue
            </p>

        </div>

        <!-- Form -->
        <form class="mt-8">

            <!-- Email -->
            <div class="mb-5">

                <label class="block mb-2 text-gray-700 font-medium">
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    class="w-full border border-gray-300 rounded-md p-3 focus:outline-none focus:border-[#9D6C43]">

            </div>

            <!-- Password -->
            <div class="mb-5">

                <label class="block mb-2 text-gray-700 font-medium">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    class="w-full border border-gray-300 rounded-md p-3 focus:outline-none focus:border-[#9D6C43]">

            </div>

            <!-- Remember -->
            <div class="flex justify-between items-center mb-6">

                <label class="flex items-center gap-2">

                    <input type="checkbox">

                    <span class="text-sm">
                        Remember Me
                    </span>

                </label>

                <a href="#" class="text-[#9D6C43] text-sm hover:underline">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->
            <button
                class="w-full bg-[#9D6C43] hover:bg-[#7f5636] text-white py-3 uppercase tracking-widest transition rounded-md">

                Login

            </button>

        </form>

        <!-- Divider -->
        <div class="flex items-center my-8">

            <div class="flex-1 border-t"></div>

            <span class="px-4 text-gray-500 text-sm">
                OR
            </span>

            <div class="flex-1 border-t"></div>

        </div>

        <!-- Create Account -->
        <p class="text-center text-gray-600">

            Don't have an account?

            <a href="register.html"
               class="text-[#9D6C43] font-semibold hover:underline">

                Create Account

            </a>

        </p>

        <!-- Back -->
        <div class="text-center mt-8">

            <a href="../Index.html"
               class="text-[#9D6C43] hover:underline">

                ← Back to Home

            </a>

        </div>

    </div>

</body>

</html>
